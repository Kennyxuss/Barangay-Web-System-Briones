{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height:50vh;">
  <div class="display-1 fw-bold text-bc">404</div>
  <h3 class="fw-bold mb-2">Page Not Found</h3>

</div>
{% endblock %}
