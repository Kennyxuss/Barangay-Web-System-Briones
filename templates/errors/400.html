{% extends 'base.html' %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height:50vh;">
  <div class="display-1 fw-bold text-warning">400</div>
  <h3 class="fw-bold mb-2">Invalid Request</h3>
  <p class="text-muted">{{ message or 'Your request could not be processed. It may have expired — please go back and try again.' }}</p>
  <a href="{{ url_for('home') }}" class="btn btn-bc mt-2 px-4"><i class="bi bi-house me-2"></i>Back to Homepage</a>
</div>
{% endblock %}
