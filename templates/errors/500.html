{% extends 'base.html' %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height:50vh;">
  <div class="display-1 fw-bold text-dark">500</div>
  <h3 class="fw-bold mb-2">Something Went Wrong</h3>

  <a href="{{ url_for('home') }}" class="btn btn-bc mt-2 px-4"><i class="bi bi-house me-2"></i>Back to Homepage</a>
</div>
{% endblock %}
