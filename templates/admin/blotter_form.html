{% extends 'admin/base_admin.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Blotter entry details{% endblock %}

{% block admin_content %}
<div class="row justify-content-center">
  <div class="col-xl-9">
    <div class="card">
      <div class="card-header"><i class="bi bi-journal-bookmark me-2"></i>Blotter Entry</div>
      <div class="card-body p-4">
        <form method="post"
              action="{{ url_for('admin_blotter_edit', entry_id=item.id) if item else url_for('admin_blotter_add') }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Complainant <span class="text-danger">*</span></label>
              <input type="text" name="complainant" class="form-control" required maxlength="120"
                     value="{{ item.complainant or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Respondent</label>
              <input type="text" name="respondent" class="form-control" maxlength="120"
                     value="{{ item.respondent or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Incident Type <span class="text-danger">*</span></label>
              <input type="text" name="incident_type" class="form-control" required maxlength="100"
                     placeholder="e.g., Noise Complaint, Physical Altercation" value="{{ item.incident_type or '' }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Incident Date <span class="text-danger">*</span></label>
              <input type="date" name="incident_date" class="form-control" required
                     max="{{ current_year }}-12-31" value="{{ item.incident_date or '' }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select name="status" class="form-select">
                {% for st in ['Open', 'Under Investigation', 'Settled', 'Closed'] %}
                <option value="{{ st }}" {{ 'selected' if (item and item.status == st) or (not item and st == 'Open') }}>{{ st }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-8">
              <label class="form-label">Incident Location</label>
              <input type="text" name="incident_location" class="form-control" maxlength="150"
                     value="{{ item.incident_location or '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="4">{{ item.description or '' }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Action Taken</label>
              <textarea name="action_taken" class="form-control" rows="3">{{ item.action_taken or '' }}</textarea>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4 pt-2 border-top">
            <button type="submit" class="btn btn-bc px-4"><i class="bi bi-check-lg me-1"></i>Save Entry</button>
            <a href="{{ url_for('admin_blotter') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
