{% extends 'base.html' %}
{% block title %}Change Password | {{ system_name }}{% endblock %}
{% block content %}
<section class="hero-section py-4">
  <div class="container">
    <h2 class="fw-bold mb-1"><i class="bi bi-key me-2"></i>Change Password</h2>
    <p class="text-white-50 mb-0">Keep your resident account secure</p>
  </div>
</section>
<div class="container py-4">
  <ul class="nav nav-pills mb-4 gap-2">
    <li class="nav-item"><a class="nav-link" href="{{ url_for('resident_dashboard') }}">Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('resident_profile') }}">My Profile</a></li>
    <li class="nav-item"><a class="nav-link active" href="{{ url_for('resident_change_password') }}">Change Password</a></li>
  </ul>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body p-4">
          <form method="post" action="{{ url_for('resident_change_password') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label class="form-label">Current Password <span class="text-danger">*</span></label>
              <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password <span class="text-danger">*</span></label>
              <input type="password" name="new_password" class="form-control" required minlength="6">
            </div>
            <div class="mb-4">
              <label class="form-label">Confirm New Password <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-bc w-100"><i class="bi bi-check-lg me-1"></i>Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
